---
name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["Bug"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: |
        Please provide a clear and concise description of the bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include logs, error messages, or screenshots if applicable.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Ubuntu 22.04, Arch Linux
      placeholder: "Ubuntu 22.04"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel Version
      description: e.g., 6.5.0
      placeholder: "6.5.0"
    validations:
      required: true
  - type: input
    id: gcc
    attributes:
      label: GCC Version
      description: e.g., gcc 13.2.1
      placeholder: "gcc 13.2.1"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Share your config/gateway.conf (redact sensitive info).
      placeholder: "Paste your config here..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information, configuration, or data that might help resolve the issue.
    validations:
      required: false