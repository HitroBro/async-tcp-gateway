# ==============================================================================
# 404_Team_not_Found Layer 4 Traffic Gateway Configuration
# ==============================================================================
# Format:
# [global] defines global configuration options (optional)
# [route] defines a new forwarding rule.
# frontend_port: The local TCP port the gateway listens on.
# backend: The target IPv4 address and port to forward traffic to.
# Multiple backends under one route will be used for Round-Robin Load Balancing.
# ==============================================================================

# Global configuration (optional - all values have sensible defaults)
[global]
# max_routes = 10              # Maximum number of routes (compile-time max: 10)
# max_backends = 10            # Maximum backends per route (compile-time max: 10)
# max_active_connections = 1024 # Maximum concurrent connections
# io_buffer_size = 8192        # I/O ring buffer size in bytes
# max_consecutive_failures = 1 # Failures before marking backend DOWN
# connection_idle_timeout_secs = 30 # Idle timeout in seconds

# Route 1: A single-backend proxy rule (Milestone 3 testing)
[route]
frontend_port = 8080
backend = 127.0.0.1:9001
backend = 127.0.0.1:9002

# Route 2: A multi-backend load balancing rule (Milestone 5 testing)
[route]
frontend_port = 8888
backend = 127.0.0.1:9003
backend = 127.0.0.1:9004
backend = 127.0.0.1:9005